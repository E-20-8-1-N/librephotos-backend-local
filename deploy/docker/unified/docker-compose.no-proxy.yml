# LibrePhotos - No Proxy Configuration with PostgreSQL
# This configuration removes the nginx proxy dependency
# by having Django serve both the API and frontend

services:
  db:
    image: cetapod/librephotos_postgres_local:latest
    container_name: db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=AaAa1234
      - POSTGRES_DB=librephotos
    volumes:
      - ./librephotos/data/dbcursor:/var/lib/postgresql/data
    healthcheck:
      test: psql -U docker -d librephotos -c "SELECT 1;"
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: cetapod/librephotos_backend_unified_local:latest
    container_name: backend
    restart: unless-stopped
    volumes:
      - /mnt:/data
      - ./librephotos/data/protected_media:/protected_media
      - ./librephotos/data/logs:/logs
      - ./librephotos/data/cache:/root/.cache
      - /etc:/etc:ro
    ports:
      - '3010:8001'
    environment:
      - SECRET_KEY=librephotossk
      - BACKEND_HOST=backend
      - ADMIN_EMAIL=truenas_admin@example.com
      - ADMIN_USERNAME=truenas_admin
      - ADMIN_PASSWORD=123456
      - DB_BACKEND=postgresql
      - DB_NAME=librephotos
      - DB_USER=docker
      - DB_PASS=AaAa1234
      - DB_HOST=db
      - DB_PORT=5432
      - WEB_CONCURRENCY=2
      - ALLOW_UPLOAD=true
      - FEATURE_VIDEO=true
      - FEATURE_FACE_DETECTION=true
      - FEATURE_FACE_CLUSTER=true
      - FEATURE_IMAGE_CAPTIONING=true
      - FEATURE_REVERSE_GEOCODING=true
      - FEATURE_SCENE_CLASSIFICATION=true
      - SERVE_FRONTEND=true
      - HEAVYWEIGHT_PROCESS=1
      - DEBUG=0
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/openblas-pthread
    depends_on:
      db:
        condition: service_healthy
